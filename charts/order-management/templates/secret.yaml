{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "order-management.databaseSecretName" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- /*
REST identity keys (ADR-0011 / fleet ADR 0005). Rendered only when the chart
owns the Secret (no auth.existingSecret) and at least one key is set; each
entry is emitted only when non-empty so a blank value never becomes an
empty-string key the binary would have to filter out.
*/}}
{{- if and (not .Values.auth.existingSecret) (include "order-management.authSecretHasKeys" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "order-management.authSecretName" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.readKey }}
  API_READ_KEY: {{ .Values.auth.readKey | quote }}
  {{- end }}
  {{- if .Values.auth.readWriteKey }}
  API_READWRITE_KEY: {{ .Values.auth.readWriteKey | quote }}
  {{- end }}
  {{- if .Values.inventoryStorage.apiKey }}
  INVENTORY_STORAGE_API_KEY: {{ .Values.inventoryStorage.apiKey | quote }}
  {{- end }}
{{- end }}
