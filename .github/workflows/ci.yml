name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# v1 ran only `lint` and `test`. `helm-lint`, `docker-publish`, and `release`
# are now onboarded (see CLAUDE.md's v1 scope note and the
# docker-helm-release PR) — `mutation` and `bdd` remain deliberately deferred.
jobs:
  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.13.1
          args: --timeout=5m

  # ============================================================
  # CLASSIFICATION: UNIT TESTING
  # ============================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build and vet
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      - name: gofmt
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "::error::the following files are not gofmt'd:"
            echo "$files"
            exit 1
          fi

      - name: Unit tests with coverage
        run: |
          set -euo pipefail
          go test ./... -race \
            -coverprofile=coverage.out \
            -coverpkg=./internal/domain/...,./internal/application/...

      - name: Coverage gate
        env:
          THRESHOLD: "90"
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "### Coverage: ${COVERAGE}% (gate: ${THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit !(c < t) }'; then
            echo "::error::coverage ${COVERAGE}% is below the ${THRESHOLD}% gate"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  # ============================================================
  # CLASSIFICATION: INTEGRATION TESTING (isolated Testcontainers Kafka)
  # ============================================================
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build, vet, and test Kafka adapter against Testcontainers
        run: |
          set -euo pipefail
          go build -tags=integration ./...
          go vet -tags=integration ./...
          go test -tags=integration ./internal/adapters/outbound/kafka


  # ============================================================
  # CLASSIFICATION: PACKAGING VALIDATION (Helm chart)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          check-latest: true
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: Run chart-testing (lint)
        run: ct lint --charts charts/order-management --validate-maintainers=false --check-version-increment=false

  # Shift-left container scan: builds the image (no push) on every push AND
  # every PR, so a vulnerable base image or dependency is caught before
  # merge, not just at publish time. Blocks on CRITICAL/HIGH with a known
  # fix; findings also land in the repo's Security tab (SARIF) regardless
  # of pass/fail so history is visible even when nothing blocks.
  # ============================================================
  # CLASSIFICATION: SECURITY SCANNER (container image)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: order-management:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Trivy scan (SARIF, always uploaded)"
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: always()
        with:
          image-ref: 'order-management:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - name: "Trivy scan (blocking gate: CRITICAL/HIGH with a fix available)"
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: 'order-management:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================
  # CLASSIFICATION: PUBLISH (Docker image) -- push-to-main only
  # ============================================================
  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (Fulcio/Rekor via GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/claudioed/order-management:latest
            ghcr.io/claudioed/order-management:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign the published image (keyless, GitHub OIDC identity)
        run: |
          cosign sign --yes \
            ghcr.io/claudioed/order-management@${{ steps.build.outputs.digest }}
      - name: Generate SBOM (SPDX) for the published image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/claudioed/order-management@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest the image with its SBOM (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ghcr.io/claudioed/order-management@${{ steps.build.outputs.digest }}
      - name: Upload SBOM as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # Cuts a GitHub Release (+ matching git tag + versioned Docker tag) on every
  # merge to main. Runs only after docker-publish actually succeeded, so a
  # release always points at an image that is genuinely live on GHCR.
  # Versioning: simple auto-increment patch (vX.Y.Z -> vX.Y.(Z+1)), starting
  # at v0.1.0 if no tag exists yet. No commit-message parsing.
  # ============================================================
  # CLASSIFICATION: PUBLISH (GitHub release + Helm chart) -- push-to-main only
  # ============================================================
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        run: |
          git fetch origin --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the already-published image with the release version
        run: |
          docker buildx imagetools create \
            -t ghcr.io/claudioed/order-management:${{ steps.version.outputs.version }} \
            ghcr.io/claudioed/order-management:${{ env.SHORT_SHA }}
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.16.4
      - name: Package and publish the Helm chart for this release
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${CHART_VERSION#v}"
          mkdir -p /tmp/chart-out
          helm package charts/order-management \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            -d /tmp/chart-out
          echo "CHART_TGZ=/tmp/chart-out/order-management-${CHART_VERSION}.tgz" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart-out/order-management-${CHART_VERSION}.tgz" \
            oci://ghcr.io/claudioed
      - name: Create and push the git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.CHART_TGZ }}
          body: |
            Docker image: `ghcr.io/claudioed/order-management:${{ steps.version.outputs.version }}`
            (also tagged `latest` and `${{ env.SHORT_SHA }}`)

            Helm chart: `oci://ghcr.io/claudioed/order-management:${{ steps.version.outputs.version }}`
            (also attached below as a `.tgz`)
